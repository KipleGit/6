<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZone - Обратная связь</title>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 0; 
            background: #f4f7f6; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            color: #333; 
        }

        .header { background: #001f3f; color: white; padding: 20px; text-align: center; }
        .header__logo { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .header__link { color: white; text-decoration: none; margin: 0 10px; transition: color 0.3s; }
        .header__link:hover { color: #00d4ff; }
        .header__link--active { color: #00d4ff; font-weight: bold; }

        .main-content { 
            padding: 40px 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
            flex: 1; 
            width: 100%; 
            box-sizing: border-box; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .feedback-section {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            animation: fadeInUp 0.8s ease-out;
            box-sizing: border-box;
        }
        .feedback-section h1 { margin-top: 0; text-align: center; color: #001f3f; margin-bottom: 25px; font-size: 28px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #444; font-size: 14px;}

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.4);
        }

        .btn-submit {
            background: #28a745;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #218838;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3);
        }

        /* Анимация появления */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

.footer {
    background-color: #2c2c2c;
    color: white;
    padding: 30px 0 20px;
    text-align: center;
    font-family: Arial, sans-serif;
}

.footer__title {
    display: block;
    font-size: 20px;
    margin-bottom: 15px;
}

.footer__text {
    margin: 10px 0;
    font-size: 18px;
}

.footer__link {
    color: #00d4ff;
    text-decoration: none;
}

.footer__link:hover {
    text-decoration: underline;
}

.footer__bottom {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid #444;
}

.footer__copy {
    color: #888;
    font-size: 14px;
}

        @media (max-width: 550px) {
            .header__nav { display: flex; flex-direction: column; gap: 10px; }
            .feedback-section { padding: 25px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header__logo">TechZone</div>
        <nav class="header__nav">
            <a href="TechZone.html" class="header__link">Главная</a>
            <a href="Catalog.html" class="header__link">Каталог</a>
            <a href="info.html" class="header__link">Оплата и доставка</a>
            <a href="feedback.html" class="header__link header__link--active">Обратная связь</a>
        </nav>
    </header>

    <main class="main-content">
        <section class="feedback-section">
            <h1>Напишите нам!</h1>
            <form class="feedback-form" action="#" method="POST">
                
                <div class="form-group">
                    <label for="name">Имя:</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Иван Иванов" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="example@mail.ru" required>
                </div>
                
                <div class="form-group">
                    <label for="subject">Тема сообщения:</label>
                    <select id="subject" name="subject" class="form-control">
                        <option value="question">Вопрос по товару</option>
                        <option value="delivery">Оплата и доставка</option>
                        <option value="return">Возврат или гарантия</option>
                        <option value="other">Другое</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="message">Сообщение:</label>
                    <textarea id="message" name="message" class="form-control" rows="5" placeholder="Напишите ваше сообщение здесь..." required></textarea>
                </div>
                
                <button type="submit" class="btn-submit">Отправить сообщение</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__content">
            <b class="footer__title">Контакты:</b>
            <p class="footer__text">Телефон: <a href="tel:+79990000000" class="footer__link">+7 (999) 000-00-00</a></p>
            <p class="footer__text">Почта: <a href="mailto:pochta@gmail.com" class="footer__link">pochta@gmail.com</a></p>
        </div>
        <div class="footer__bottom">
            <p class="footer__copy">© 2026 TechZone. Все права защищены.</p>
        </div>
    </footer>

</body>
</html>
